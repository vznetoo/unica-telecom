<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selecionar Linha</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* =========================================================
           BODY
        ========================================================= */

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 255, 255, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #78b985 0%,
                    #4d995e 35%,
                    #2d8447 70%,
                    #087936 100%
                );

            background-attachment: fixed;
        }


        /* =========================================================
           BOTÃO VOLTAR
        ========================================================= */

        .btn-voltar {
            position: fixed;
            top: 28px;
            left: 48px;

            width: 50px;
            height: 50px;

            padding: 0;
            margin: 0;

            background: rgb(255, 255, 255);

            border: 1px solid rgb(255, 255, 255);
            border-radius: 50%;

            color: #05ff6d;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);

            outline: none;

            cursor: pointer;

            z-index: 1000;

            appearance: none;
            -webkit-appearance: none;

            transition: all 0.2s ease;
        }

        .btn-voltar i {
            color: #00c853;
            font-size: 22px;
            line-height: 1;
            font-weight: 900;
        }

        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateX(-3px);
        }

        .btn-voltar:focus,
        .btn-voltar:active {
            outline: none;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }


        /* =========================================================
           ÁREA PRINCIPAL
        ========================================================= */

        .pagina {
            min-height: 100vh;

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 20px;
        }


        /* =========================================================
           TELA DE SELEÇÃO DE LINHAS
        ========================================================= */

        .container-selecao {
            width: 100%;
            max-width: 760px;

            text-align: center;
        }

        .logo-topo {
            width: 120px;
            height: 120px;

            margin: 0 auto 22px;

            background: #ffffff;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            box-shadow:
                0 12px 35px rgba(0, 60, 25, 0.15);
        }

        .logo-topo img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .titulo-selecao {
            color: #ffffff;

            font-size: 38px;

            font-weight: 700;

            margin-bottom: 10px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.18);
        }

        .subtitulo-selecao {
            color: #eef9f0;

            font-size: 15px;

            font-weight: 500;

            margin-bottom: 35px;
        }

        .quantidade-linhas {
            color: #00e56b;

            font-weight: 700;
        }


        /* =========================================================
           LISTA DE LINHAS
        ========================================================= */

        #listaLinhas {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 18px;
        }


        /* =========================================================
           CARD DA LINHA (MODERNIZADO E DIVIDIDO)
        ========================================================= */

        .card-linha {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 35px rgba(0, 50, 20, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: 1.5px solid #d4f5e0;
            text-align: left;
        }

        .card-linha:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 50, 20, 0.18);
        }

        /* CARTÃO DE PLANO VENCIDO */
.card-linha.plano-vencido {
    border: 1.5px solid #ef4444;
    box-shadow: 0 8px 25px rgba(239, 68, 68, 0.15);
}

.card-linha.plano-vencido .card-linha-topo {
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
}

.card-linha.plano-vencido .btn-acessar {
    background: #fee2e2;
    color: #dc2626;
}
.card-linha.plano-vencido .status-badge {
    background: #ffffff;
    color: #dc2626;
}

        /* PARTE SUPERIOR (Fundo verde com gradiente) */
        .card-linha-topo {
            background: linear-gradient(135deg, #00c853 0%, #009639 100%);
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
        }

        .info-plano-topo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 700;
        }

        /* Ícone com fundo verde translúcido e desenho do celular branco */
        .icone-celular-verde {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.22);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* PARTE INFERIOR (Linha dividida com os dados do número) */
        .card-linha-corpo {
            padding: 20px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
        }

        .dados-linha {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .label-numero {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .dados-linha h2 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* Botão de avançar verde moderno */
        .btn-acessar {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #e9fff0;
            color: #00a83a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .btn-acessar:hover {
            background: #00c853;
            color: #ffffff;
            transform: translateX(3px);
        }


        /* =========================================================
           TELA SEM SERVIÇO
        ========================================================= */

        .tela-sem-servico {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
        }

        .conteudo-sem-servico {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icone-sem-servico {
            width: 180px;
            height: 180px;
            margin-bottom: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 35px rgba(0, 50, 20, 0.10);
        }

        .icone-sem-servico img {
            width: 135px;
            height: 135px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 50%;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .conteudo-sem-servico h1 {
            max-width: 700px;
            color: #ffffff;
            font-size: clamp(30px, 4vw, 44px);
            line-height: 1.18;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
        }

        .linha-decorativa {
            width: 100px;
            height: 7px;
            margin: 28px 0 30px;
            border-radius: 10px;
            background: #20e879;
        }

        .mensagem-contratacao {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 32px;
            color: #ffffff;
            font-size: 19px;
            line-height: 1.5;
        }

        .mensagem-contratacao strong {
            font-size: 20px;
            font-weight: 700;
        }

        .btn-fale-conosco {
            width: 100%;
            max-width: 500px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px 25px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            background: linear-gradient(135deg, #16d96b, #00bb50);
            color: #ffffff;
            text-decoration: none;
            font-size: 21px;
            font-weight: 700;
            box-shadow: 0 12px 30px rgba(0, 60, 25, 0.20);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-fale-conosco:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(0, 60, 25, 0.28);
        }

        .btn-fale-conosco i {
            font-size: 28px;
        }


        /* =========================================================
           LOADING E ERRO
        ========================================================= */

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
        }

        .loading i {
            margin-right: 10px;
        }

        .erro-container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 22px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 50, 20, 0.15);
        }

        .erro-icone {
            width: 50px;
            height: 50px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffeded;
            color: #e53935;
            font-size: 20px;
        }

        .erro-container p {
            color: #555555;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-tentar {
            border: none;
            padding: 11px 22px;
            border-radius: 12px;
            background: #00c853;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }


        /* =========================================================
           RESPONSIVO
        ========================================================= */

        @media (max-width: 700px) {
            .btn-voltar {
                top: 20px;
                left: 20px;
                width: 45px;
                height: 45px;
                background: rgba(255, 255, 255, 0.25);
            }

            .btn-voltar i {
                font-size: 19px;
            }

            .pagina {
                padding: 40px 18px;
            }

            .logo-topo {
                width: 100px;
                height: 100px;
                padding: 15px;
            }

            .titulo-selecao {
                font-size: 28px;
            }

            .subtitulo-selecao {
                font-size: 14px;
            }

            .card-linha-corpo {
                padding: 17px;
            }

            .dados-linha h2 {
                font-size: 18px;
            }

            .btn-acessar {
                width: 42px;
                height: 42px;
            }
        }

    </style>

</head>


<body>

    <!-- =========================================================
         BOTÃO VOLTAR
    ========================================================== -->
    <button
        class="btn-voltar"
        onclick="window.location.href='servicos.html'"
        title="Voltar para os serviços"
    >
        <i class="fa-solid fa-arrow-left"></i>
    </button>


    <!-- =========================================================
         CONTEÚDO
    ========================================================== -->
    <div id="app">
        <div class="loading">
            <div>
                <i class="fa-solid fa-spinner fa-spin"></i>
                Carregando suas linhas...
            </div>
        </div>
    </div>


    <script>

        const API_BASE_URL = "https://unica-telecom.onrender.com";
        const app = document.getElementById("app");

        function obterCpfCliente() {
            const dadosCliente = localStorage.getItem("dadosCliente");
            if (dadosCliente) {
                try {
                    const cliente = JSON.parse(dadosCliente);
                    if (cliente.cpf) return cliente.cpf;
                    if (cliente.CPF) return cliente.CPF;
                } catch (erro) {
                    console.error("Erro ao ler dadosCliente:", erro);
                }
            }
            return localStorage.getItem("cpf") ||
                   localStorage.getItem("clienteCpf") ||
                   localStorage.getItem("cpfCliente");
        }

        function limparCpf(cpf) {
            return String(cpf || "").replace(/\D/g, "");
        }

        function formatarNumeroLinha(numero) {
            let limpo = String(numero || "").replace(/\D/g, "");
            if (limpo.startsWith("55")) {
                limpo = limpo.substring(2);
            }

            if (limpo.length === 11) {
                const ddd = limpo.substring(0, 2);
                const celular = limpo.substring(2);
                return `(${ddd}) ${celular.substring(0, 5)}-${celular.substring(5)}`;
            }

            if (limpo.length === 10) {
                const ddd = limpo.substring(0, 2);
                const telefone = limpo.substring(2);
                return `(${ddd}) ${telefone.substring(0, 4)}-${telefone.substring(4)}`;
            }

            return numero;
        }

        function formatarStatus(status) {
            const statusOriginal = String(status || "").trim().toUpperCase();
            switch (statusOriginal) {
                case "ACTIVE":
                case "ATIVO":
                case "ATIVA":
                    return "Ativo";
                case "INACTIVE":
                case "INATIVO":
                case "INATIVA":
                    return "Inativo";
                case "SUSPENDED":
                case "SUSPENSO":
                case "SUSPENSA":
                    return "Suspenso";
                case "BLOCKED":
                case "BLOQUEADO":
                case "BLOQUEADA":
                    return "Bloqueado";
                case "CANCELED":
                case "CANCELLED":
                case "CANCELADO":
                case "CANCELADA":
                    return "Cancelado";
                case "PENDING":
                case "PENDENTE":
                    return "Pendente";
                default:
                    return status || "Ativo";
            }
        }

        function mostrarTelaSemServico() {
            app.innerHTML = `
                <div class="tela-sem-servico">
                    <div class="conteudo-sem-servico">
                        <div class="icone-sem-servico">
                            <img src="assets/Logoo.png" alt="Única Telecom">
                        </div>
                        <h1>Você ainda não possui<br>este serviço conosco.</h1>
                        <div class="linha-decorativa"></div>
                        <p class="mensagem-contratacao">
                            <span>Deseja contratar este serviço?</span>
                            <strong>Entre em contato com nossa equipe.</strong>
                        </p>
                        <a href="https://unicatelecom.web.vmix.chat/" target="_blank" rel="noopener noreferrer" class="btn-fale-conosco">
                            <i class="fa-regular fa-comments"></i>
                            <span>Fale conosco</span>
                        </a>
                    </div>
                </div>
            `;
        }

        function mostrarErro(mensagem) {
            app.innerHTML = `
                <div class="pagina">
                    <div class="erro-container">
                        <div class="erro-icone">
                            <i class="fa-solid fa-exclamation"></i>
                        </div>
                        <p>${mensagem}</p>
                        <button class="btn-tentar" onclick="carregarLinhas()">Tentar novamente</button>
                    </div>
                </div>
            `;
        }


async function mostrarLinhas(cliente) {
    const linhas = Array.isArray(cliente?.lines) ? cliente.lines : [];

    if (linhas.length === 0) {
        mostrarTelaSemServico();
        return;
    }

    let cards = "";

    for (const [index, linha] of linhas.entries()) {
        const numeroBruto = linha.msisdn || linha.numero || "Número não informado";
        const numeroFormatado = formatarNumeroLinha(numeroBruto);
        const status = formatarStatus(linha.status);

        // Consultar a validade do plano da linha
        let planoVencido = false;

        try {
            const planosResposta = await fetch(
                `${API_BASE_URL}/api/movel/linha/${linha.id}/planos`
            );

            if (planosResposta.ok) {
                const dadosPlanosLinha = await planosResposta.json();

                const planoAtual = dadosPlanosLinha.items?.find(
                    plano =>
                        String(plano.status || "").toUpperCase() === "ACTIVE"
                ) || dadosPlanosLinha.items?.[0];

                if (planoAtual?.endDate) {
                    const dataFim = new Date(planoAtual.endDate).getTime();

                    planoVencido = !isNaN(dataFim) && dataFim <= Date.now();
                }
            }
        } catch (erro) {
            console.error("Erro ao consultar validade da linha:", erro);
        }

        const tipo = String(
            linha.type || linha.tipo || "Linha móvel"
        ).toUpperCase() === "ESIM"
            ? "E-SIM"
            : (linha.type || linha.tipo || "Linha móvel");

        cards += `
            <div class="card-linha ${planoVencido ? 'plano-vencido' : ''}" onclick="selecionarLinha(${index})">

                <div class="card-linha-topo">
                    <div class="info-plano-topo">
                        <div class="icone-celular-verde">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </div>
                        <span>${tipo}</span>
                    </div>

                    <span class="status-badge">
                        ${planoVencido ? 'Plano Vencido' : status}
                    </span>
                </div>

                <div class="card-linha-corpo">
                    <div class="dados-linha">
                        <span class="label-numero">Número da Linha:</span>
                        <h2>${numeroFormatado}</h2>
                    </div>

                    <button class="btn-acessar" title="Acessar linha"
                        onclick="event.stopPropagation(); selecionarLinha(${index})">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

            </div>
        `;
    }

    const quantidadeTexto = linhas.length === 1
        ? `Você possui <span class="quantidade-linhas">1</span> linha móvel vinculada ao seu cadastro.`
        : `Você possui <span class="quantidade-linhas">${linhas.length}</span> linhas móveis vinculadas ao seu cadastro.`;

    app.innerHTML = `
        <div class="pagina">
            <div class="container-selecao">
                <div class="logo-topo">
                    <img src="assets/Logoo.png" alt="Única Telecom">
                </div>
                <h1 class="titulo-selecao">Selecione sua Linha</h1>
                <p class="subtitulo-selecao">${quantidadeTexto}</p>
                <div id="listaLinhas">${cards}</div>
            </div>
        </div>
    `;

    window.linhasDisponiveis = linhas;
}


        function selecionarLinha(index) {
            const linhas = window.linhasDisponiveis || [];
            const linha = linhas[index];

            if (!linha) return;

            localStorage.setItem("linhaMovelSelecionadaId", linha.id || "");
            localStorage.setItem("linhaMovelSelecionadaNumero", linha.msisdn || "");
            localStorage.setItem("linhaMovelSelecionada", JSON.stringify(linha));
            localStorage.setItem("contratoMovelSelecionadoId", linha.id || "");

            window.location.href = "dashboard.html";
        }

        async function carregarLinhas() {
            try {
                app.innerHTML = `
                    <div class="loading">
                        <div>
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            Carregando suas linhas...
                        </div>
                    </div>
                `;

                const cpfOriginal = obterCpfCliente();
                const cpf = limparCpf(cpfOriginal);

                if (!cpf || cpf.length !== 11) {
                    mostrarErro("Não foi possível identificar o CPF do cliente.");
                    return;
                }

                const resposta = await fetch(`${API_BASE_URL}/api/movel/cliente/${encodeURIComponent(cpf)}`);

                if (resposta.status === 404) {
                    mostrarTelaSemServico();
                    return;
                }

                if (!resposta.ok) {
                    mostrarErro("Não foi possível carregar suas linhas no momento.");
                    return;
                }

                const dados = await resposta.json();
                mostrarLinhas(dados);

            } catch (erro) {
                console.error("Erro ao carregar linhas:", erro);
                mostrarErro("Não foi possível conectar ao servidor. Tente novamente.");
            }
        }

        document.addEventListener("DOMContentLoaded", carregarLinhas);

    </script>

</body>

</html>
